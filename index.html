<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Idols Ranking</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{font-family:sans-serif;background:#07071a;color:#fff;text-align:center}
button{cursor:pointer}
.g-img-wrap{width:80px;height:80px;border-radius:50%;overflow:hidden;margin:auto}
.g-img-wrap img{width:100%;height:100%;object-fit:cover}
</style>
</head>

<body>

<h1>IDOLS RANKING</h1>

<div>
<button onclick="sv('battle')">Battle</button>
<button onclick="sv('lb')">Leaderboard</button>
</div>

<h3 id="btText"></h3>

<div id="battleView">
  <div>
    <div id="imgL" class="g-img-wrap"></div>
    <h2 id="nmL"></h2>
    <p id="fdL"></p>
    <p id="vtL"></p>
    <button onclick="doVote('left')">Vote</button>
  </div>

  <h2>VS</h2>

  <div>
    <div id="imgR" class="g-img-wrap"></div>
    <h2 id="nmR"></h2>
    <p id="fdR"></p>
    <p id="vtR"></p>
    <button onclick="doVote('right')">Vote</button>
  </div>

  <br>
  <button onclick="nextBattle()">Next battle</button>
</div>

<div id="lbView" style="display:none">
  <h2>Leaderboard</h2>
  <div id="lbList"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCmRJmcOocUBcScst31zyKy_eDwsA3BiWo",
  authDomain: "idolsranking-f2790.firebaseapp.com",
  projectId: "idolsranking-f2790"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const CATS=["Best dance","Best vocals"];
let cat="Best dance";

const GRP=[
{name:"BTS",f:"ARMY",img:"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/BTS_at_the_2019_Melon_Music_Awards.jpg/220px-BTS_at_the_2019_Melon_Music_Awards.jpg"},
{name:"BLACKPINK",f:"BLINK",img:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/Blackpink_at_the_2019_Billboard_Music_Awards_%28cropped%29.jpg/220px-Blackpink_at_the_2019_Billboard_Music_Awards_%28cropped%29.jpg"},
{name:"EXO",f:"EXO-L",img:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/EXO_at_the_2019_Melon_Music_Awards.jpg/220px-EXO_at_the_2019_Melon_Music_Awards.jpg"}
];

let vv={};
GRP.forEach(g=>CATS.forEach(c=>vv[g.name+"__"+c]=0));

/* 🔥 FIXED battle system */
let battles=[];
let idx=0;

function genBattles(){
  battles=[];
  for(let i=0;i<GRP.length;i++){
    for(let j=i+1;j<GRP.length;j++){
      battles.push([i,j]);
    }
  }
  battles.sort(()=>Math.random()-0.5);
  idx=0;
}

function pick(){
  if(idx>=battles.length) genBattles();
  const p=battles[idx++];
  return p;
}

let li=0,ri=1;

function nextBattle(){
  const p=pick();
  li=p[0];
  ri=p[1];
  render();
}

function buildImg(el,g){
  el.innerHTML=`<img src="${g.img}">`;
}

function render(){
  const L=GRP[li],R=GRP[ri];

  document.getElementById("btText").innerText=cat;

  buildImg(imgL,L);
  nmL.innerText=L.name;
  fdL.innerText=L.f;
  vtL.innerText=getVote(L.name,cat)+" votes";

  buildImg(imgR,R);
  nmR.innerText=R.name;
  fdR.innerText=R.f;
  vtR.innerText=getVote(R.name,cat)+" votes";
}

function getVote(g,c){
  return vv[g+"__"+c]||0;
}

async function doVote(side){
  const g=side==="left"?GRP[li]:GRP[ri];
  vv[g.name+"__"+cat]++;

  await db.collection("votes").doc(g.name+"_"+cat).set({
    group:g.name,
    category:cat,
    count:firebase.firestore.FieldValue.increment(1)
  },{merge:true});

  nextBattle();
}

function sv(v){
  battleView.style.display=v==="battle"?"block":"none";
  lbView.style.display=v==="lb"?"block":"none";
  if(v==="lb") renderLB();
}

function renderLB(){
  let arr=GRP.map(g=>({n:g.name,v:getVote(g.name,cat)}));
  arr.sort((a,b)=>b.v-a.v);
  lbList.innerHTML=arr.map(g=>`${g.n} - ${g.v}`).join("<br>");
}

/* start */
genBattles();
nextBattle();
</script>

</body>
</html>
