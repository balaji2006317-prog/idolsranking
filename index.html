<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>K-pop Bias Battle</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      min-height: 100vh;
      color: #f0eeff;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }

    /* Hero */
    .hero { text-align: center; margin-bottom: 2rem; }
    .hero-badge {
      display: inline-block; background: #2a1f4e; color: #a99ef5;
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      padding: 4px 16px; border-radius: 99px; border: 1px solid #4a3d8f; margin-bottom: 14px;
    }
    .hero h1 { font-size: 30px; font-weight: 600; line-height: 1.25; color: #f0eeff; }
    .hero h1 span { color: #a99ef5; }
    .hero p { font-size: 14px; color: #7a7a99; margin-top: 8px; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: #1a1530; border: 1px solid #2e2b52; border-radius: 99px;
      padding: 5px 14px; font-size: 12px; color: #a99ef5; margin-top: 12px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #7F77DD; animation: blink 1.2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* Stars */
    .stars { display: flex; justify-content: center; gap: 8px; margin: 1.5rem 0; }
    .star { width: 5px; height: 5px; border-radius: 50%; background: #3a3860; animation: pulse 2s infinite; }
    .star:nth-child(2){animation-delay:.4s;background:#534AB7}
    .star:nth-child(3){animation-delay:.8s}
    .star:nth-child(4){animation-delay:1.2s;background:#534AB7}
    .star:nth-child(5){animation-delay:1.6s}
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

    /* Categories */
    .cat-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 1.5rem; }
    .cat-btn {
      padding: 7px 18px; border-radius: 99px; border: 1px solid #2e2b52;
      font-size: 13px; cursor: pointer; background: #161628; color: #7a7a99; transition: all .15s;
    }
    .cat-btn:hover { background: #1f1c3a; color: #c0b8f8; border-color: #534AB7; }
    .cat-btn.active { background: #2a1f4e; color: #a99ef5; border-color: #7F77DD; }

    /* Toggle */
    .toggle-wrap { text-align: center; margin-bottom: 1.5rem; }
    .toggle { display: inline-flex; background: #13122b; border: 1px solid #2e2b52; border-radius: 99px; padding: 3px; }
    .tog-btn { padding: 7px 22px; border-radius: 99px; font-size: 13px; cursor: pointer; color: #7a7a99; border: none; background: transparent; transition: all .15s; }
    .tog-btn.active { background: #2a1f4e; color: #c0b8f8; }

    /* Battle */
    .battle-label { text-align: center; margin-bottom: 1rem; }
    .battle-badge { display: inline-block; background: #1a1530; border: 1px solid #2e2b52; border-radius: 8px; padding: 6px 22px; font-size: 13px; color: #a99ef5; }
    .arena { display: grid; grid-template-columns: 1fr 52px 1fr; gap: 12px; align-items: center; margin-bottom: 1rem; }
    .group-card { background: #13122b; border: 1px solid #2e2b52; border-radius: 18px; padding: 1.75rem 1rem; text-align: center; cursor: pointer; transition: all .2s; }
    .group-card:hover { border-color: #7F77DD; background: #1a1840; }
    .group-card.voted { border-color: #7F77DD; border-width: 2px; background: #1e1848; }
    .group-card.loser { opacity: .3; pointer-events: none; }
    .g-logo { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff; border: 2px solid rgba(255,255,255,.12); }
    .g-name { font-size: 18px; font-weight: 600; color: #f0eeff; }
    .g-fandom { font-size: 12px; color: #7a7a99; margin-top: 3px; }
    .g-votes { font-size: 14px; font-weight: 500; color: #a99ef5; margin-top: 10px; }
    .vbar-wrap { margin-top: 10px; height: 4px; background: #2a2750; border-radius: 2px; }
    .vbar { height: 4px; border-radius: 2px; background: #7F77DD; transition: width .5s; }
    .voted-tag { display: none; margin-top: 9px; background: #2a1f4e; color: #a99ef5; font-size: 11px; padding: 3px 12px; border-radius: 99px; border: 1px solid #534AB7; }
    .group-card.voted .voted-tag { display: inline-block; }

    .vs-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .vs-ring { width: 46px; height: 46px; border-radius: 50%; background: #1a1530; border: 1px solid #2e2b52; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #a99ef5; }
    .vs-dot-col { display: flex; flex-direction: column; gap: 4px; align-items: center; }
    .vdot { width: 3px; height: 3px; border-radius: 50%; background: #2e2b52; }

    /* Toast */
    .toast { text-align: center; margin-bottom: 1rem; display: none; animation: fadeUp .3s; }
    .toast.show { display: block; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    .toast-inner { display: inline-block; background: #1a1530; border: 1px solid #534AB7; border-radius: 10px; padding: 9px 22px; font-size: 13px; color: #c0b8f8; }

    /* Buttons */
    .btn-row { display: flex; justify-content: center; margin-bottom: 2.5rem; }
    .btn-next { padding: 11px 32px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; background: #7F77DD; color: #fff; border: none; transition: background .15s; }
    .btn-next:hover { background: #534AB7; }

    /* Leaderboard */
    .lb-wrap { display: none; }
    .lb-card { background: #13122b; border: 1px solid #2e2b52; border-radius: 16px; overflow: hidden; }
    .lb-header { padding: 14px 18px; background: #0f0e22; border-bottom: 1px solid #1e1c38; display: flex; justify-content: space-between; align-items: center; }
    .lb-header h2 { font-size: 15px; font-weight: 600; color: #a99ef5; }
    .lb-total { font-size: 12px; color: #5a5a7a; }
    .lb-row { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #1a1930; }
    .lb-row:last-child { border-bottom: none; }
    .lb-rank { font-size: 13px; font-weight: 700; min-width: 32px; }
    .r1{color:#EF9F27} .r2{color:#B4B2A9} .r3{color:#D85A30} .rn{color:#3a3860}
    .lb-av { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; }
    .lb-info { flex: 1; }
    .lb-name { font-size: 14px; font-weight: 500; color: #d0ccf5; }
    .lb-sub { font-size: 11px; color: #5a5a7a; margin-top: 2px; }
    .lb-bar-wrap { width: 80px; height: 4px; background: #2a2750; border-radius: 2px; }
    .lb-bar { height: 4px; border-radius: 2px; background: #7F77DD; }
    .lb-count { font-size: 13px; font-weight: 600; color: #7F77DD; min-width: 52px; text-align: right; }
    .loading-msg { text-align: center; color: #5a5a7a; font-size: 13px; padding: 2.5rem; }

    .footer { text-align: center; margin-top: 3rem; color: #3a3860; font-size: 12px; }

    @media (max-width: 480px) {
      .g-logo { width: 58px; height: 58px; font-size: 13px; }
      .g-name { font-size: 15px; }
      .arena { grid-template-columns: 1fr 40px 1fr; gap: 8px; }
      .hero h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="hero-badge">K-pop Bias Battle</div>
    <h1>Who are the <span>best dancers</span><br>in K-pop?</h1>
    <p>Vote for your favorite group — every fan's vote counts together!</p>
    <div class="live-pill"><div class="dot"></div> Live shared votes</div>
  </div>

  <div class="stars">
    <div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div><div class="star"></div>
  </div>

  <div class="cat-row" id="catRow"></div>

  <div class="toggle-wrap">
    <div class="toggle">
      <button class="tog-btn active" onclick="switchView('battle')">Battle</button>
      <button class="tog-btn" onclick="switchView('lb')">Leaderboard</button>
    </div>
  </div>

  <!-- Battle -->
  <div id="battleView">
    <div class="battle-label">
      <div class="battle-badge" id="battleBadge">Best dance group</div>
    </div>
    <div class="arena">
      <div class="group-card" id="cardL" onclick="castVote('left')">
        <div class="g-logo" id="logoL"></div>
        <div class="g-name" id="nameL"></div>
        <div class="g-fandom" id="fandomL"></div>
        <div class="g-votes" id="votesL">loading...</div>
        <div class="vbar-wrap"><div class="vbar" id="barL" style="width:50%"></div></div>
        <div class="voted-tag">Voted!</div>
      </div>
      <div class="vs-col">
        <div class="vs-dot-col"><div class="vdot"></div><div class="vdot"></div></div>
        <div class="vs-ring">vs</div>
        <div class="vs-dot-col"><div class="vdot"></div><div class="vdot"></div></div>
      </div>
      <div class="group-card" id="cardR" onclick="castVote('right')">
        <div class="g-logo" id="logoR"></div>
        <div class="g-name" id="nameR"></div>
        <div class="g-fandom" id="fandomR"></div>
        <div class="g-votes" id="votesR">loading...</div>
        <div class="vbar-wrap"><div class="vbar" id="barR" style="width:50%"></div></div>
        <div class="voted-tag">Voted!</div>
      </div>
    </div>
    <div class="toast" id="toast"><div class="toast-inner" id="toastMsg"></div></div>
    <div class="btn-row">
      <button class="btn-next" onclick="nextBattle()">Next battle ›</button>
    </div>
  </div>

  <!-- Leaderboard -->
  <div class="lb-wrap" id="lbView">
    <div class="lb-card">
      <div class="lb-header">
        <h2 id="lbTitle">Top groups · Best dance</h2>
        <span class="lb-total" id="lbTotal"></span>
      </div>
      <div id="lbList"><div class="loading-msg">Loading votes...</div></div>
    </div>
  </div>

  <div class="footer">Made with love for K-pop fans &hearts;</div>
</div>

<script>
  /* ================================================================
     FIREBASE CONFIG — Replace with YOUR values from Firebase Console
     Steps:
       1. Go to https://firebase.google.com → sign in with Google
       2. Click "Create a project" → name it kpop-bias-battle
       3. Go to Project Settings → click the </> Web icon
       4. Copy each value below and paste it here
  ================================================================ */
  const firebaseConfig = {
    apiKey:            "PASTE_YOUR_API_KEY_HERE",
    authDomain:        "PASTE_YOUR_PROJECT_ID.firebaseapp.com",
    projectId:         "PASTE_YOUR_PROJECT_ID_HERE",
    storageBucket:     "PASTE_YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "PASTE_YOUR_SENDER_ID_HERE",
    appId:             "PASTE_YOUR_APP_ID_HERE"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  /* ================================================================
     GROUPS — Add or remove groups here anytime!
  ================================================================ */
  const CATEGORIES = [
    "Best dance",
    "Best vocals",
    "Best visuals",
    "Best energy",
    "Best fashion"
  ];

  const GROUPS = [
    { name: "BTS",        fandom: "A.R.M.Y",  color: "#534AB7", initials: "BTS" },
    { name: "BLACKPINK",  fandom: "BLINK",    color: "#993356", initials: "BP"  },
    { name: "TWICE",      fandom: "ONCE",     color: "#D85A30", initials: "TWC" },
    { name: "EXO",        fandom: "EXO-L",    color: "#185FA5", initials: "EXO" },
    { name: "aespa",      fandom: "MY",       color: "#0F6E56", initials: "AES" },
    { name: "Stray Kids", fandom: "STAY",     color: "#BA7517", initials: "SKZ" },
    { name: "SEVENTEEN",  fandom: "CARAT",    color: "#3C3489", initials: "SVT" },
    { name: "NCT 127",    fandom: "NCTzen",   color: "#A32D2D", initials: "NCT" },
    { name: "IVE",        fandom: "DIVE",     color: "#854F0B", initials: "IVE" },
    { name: "NewJeans",   fandom: "Bunnies",  color: "#3B6D11", initials: "NJ"  },
  ];

  /* ── No need to edit below this line! ── */
  let currentCat = "Best dance";
  let leftIdx = 0, rightIdx = 1;
  let hasVoted = false;
  let localVotes = {};

  function voteKey(groupName, cat) {
    return groupName.replace(/\s+/g, "_") + "__" + cat.replace(/\s+/g, "_");
  }

  async function loadAllVotes() {
    try {
      const snap = await db.collection("votes").get();
      snap.forEach(doc => { localVotes[doc.id] = doc.data().count || 0; });
    } catch (e) {
      console.warn("Firebase not set up yet — using local votes for now.");
    }
  }

  async function incrementVote(groupName, cat) {
    const key = voteKey(groupName, cat);
    localVotes[key] = (localVotes[key] || 0) + 1;
    try {
      await db.collection("votes").doc(key).set(
        { group: groupName, category: cat, count: firebase.firestore.FieldValue.increment(1) },
        { merge: true }
      );
    } catch (e) {
      console.warn("Vote saved locally only — Firebase not connected.");
    }
  }

  function getVote(groupName, cat) {
    return localVotes[voteKey(groupName, cat)] || 0;
  }

  function buildCats() {
    const row = document.getElementById("catRow");
    row.innerHTML = "";
    CATEGORIES.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "cat-btn" + (c === currentCat ? " active" : "");
      btn.textContent = c;
      btn.onclick = () => { currentCat = c; buildCats(); nextBattle(); };
      row.appendChild(btn);
    });
    document.getElementById("battleBadge").textContent = currentCat + " group";
  }

  function pickTwo() {
    let a = Math.floor(Math.random() * GROUPS.length);
    let b;
    do { b = Math.floor(Math.random() * GROUPS.length); } while (b === a);
    leftIdx = a;
    rightIdx = b;
  }

  function renderBattle() {
    const L = GROUPS[leftIdx], R = GROUPS[rightIdx];
    const lv = getVote(L.name, currentCat);
    const rv = getVote(R.name, currentCat);
    const total = lv + rv || 1;

    function fillCard(side, g, v, pct) {
      document.getElementById("logo" + side).style.background = g.color;
      document.getElementById("logo" + side).textContent = g.initials;
      document.getElementById("name" + side).textContent = g.name;
      document.getElementById("fandom" + side).textContent = g.fandom;
      document.getElementById("votes" + side).textContent = v.toLocaleString() + " votes";
      document.getElementById("bar" + side).style.width = pct + "%";
      document.getElementById("card" + side).classList.remove("voted", "loser");
    }

    fillCard("L", L, lv, Math.round(lv / total * 100));
    fillCard("R", R, rv, Math.round(rv / total * 100));
    document.getElementById("toast").classList.remove("show");
    hasVoted = false;
  }

  async function castVote(side) {
    if (hasVoted) return;
    hasVoted = true;
    const winner = side === "left" ? GROUPS[leftIdx] : GROUPS[rightIdx];
    await incrementVote(winner.name, currentCat);
    document.getElementById("card" + (side === "left" ? "L" : "R")).classList.add("voted");
    document.getElementById("card" + (side === "left" ? "R" : "L")).classList.add("loser");
    document.getElementById("toastMsg").textContent =
      "You voted for " + winner.name + "! Vote saved!";
    document.getElementById("toast").classList.add("show");
    renderBattle();
  }

  function nextBattle() { pickTwo(); renderBattle(); }

  function switchView(v) {
    document.getElementById("battleView").style.display = v === "battle" ? "block" : "none";
    document.getElementById("lbView").style.display = v === "lb" ? "block" : "none";
    document.querySelectorAll(".tog-btn").forEach((b, i) => {
      b.classList.toggle("active", (i === 0 && v === "battle") || (i === 1 && v === "lb"));
    });
    if (v === "lb") renderLB();
  }

  function renderLB() {
    document.getElementById("lbTitle").textContent = "Top groups · " + currentCat;
    const sorted = GROUPS.map(g => ({ ...g, v: getVote(g.name, currentCat) }))
                         .sort((a, b) => b.v - a.v);
    const maxV = sorted[0].v || 1;
    const total = sorted.reduce((s, g) => s + g.v, 0);
    document.getElementById("lbTotal").textContent = total.toLocaleString() + " total votes";
    document.getElementById("lbList").innerHTML = sorted.map((g, i) => {
      const rankClass = i === 0 ? "r1" : i === 1 ? "r2" : i === 2 ? "r3" : "rn";
      const medal = i === 0 ? "1st" : i === 1 ? "2nd" : i === 2 ? "3rd" : (i + 1) + "th";
      return `<div class="lb-row">
        <div class="lb-rank ${rankClass}">${medal}</div>
        <div class="lb-av" style="background:${g.color}">${g.initials}</div>
        <div class="lb-info">
          <div class="lb-name">${g.name}</div>
          <div class="lb-sub">${g.fandom} fandom</div>
        </div>
        <div class="lb-bar-wrap"><div class="lb-bar" style="width:${Math.round(g.v/maxV*100)}%"></div></div>
        <div class="lb-count">${g.v.toLocaleString()}</div>
      </div>`;
    }).join("");
  }

  (async () => {
    await loadAllVotes();
    buildCats();
    pickTwo();
    renderBattle();
  })();
</script>
</body>
</html>
